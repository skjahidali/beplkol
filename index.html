<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bewandert Engineers (P) Ltd — Under Maintenance</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="scene">
    <div class="grid"></div>

    <div class="floating floating-1"></div>
    <div class="floating floating-2"></div>
    <div class="floating floating-3"></div>

    <main class="card">
      <!-- LOGO -->
      <div class="logo-wrap">
        <img
          src="photo/BEWANDERT.png"
          alt="Bewandert Engineers (P) Ltd"
          class="logo"
          width="220"
          height="70"
          loading="eager"
          decoding="async"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        />
        <!-- Fallback if image fails -->
        <div class="logo-fallback">
          BEWANDERT
        </div>
      </div>

      <!-- CONTENT -->
      <div class="content">
        <p class="eyebrow">WELCOME</p>
        <h1>We’ll Be Back Soon</h1>
        <p class="maintenance">UNDER MAINTENANCE</p>

        <p class="description">
          Our website is currently being upgraded to serve you better.
          We’re working behind the scenes and will be back shortly.
        </p>

        <!-- LOADING ANIMATION -->
        <div class="loader" aria-label="Website maintenance in progress">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <!-- EMAIL CONTACT -->
        <div class="contact">
          <span>For any queries, contact us:</span>
          <a href="mailto:info@beplkol.com">info@beplkol.com</a>
        </div>
      </div>
    </main>

    <div class="floor-glow"></div>
  </div>
</body>
</html>
